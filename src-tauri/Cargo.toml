[package]
name = "lighterm"
version = "0.1.2"
description = "Cross-platform lightweight GUI terminal and SSH/SFTP client"
edition = "2021"

[lib]
name = "lighterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lighterm-core = { path = "../crates/lighterm-core" }
lighterm-plugin-history = { path = "../crates/plugins/history" }
lighterm-plugin-monitor = { path = "../crates/plugins/monitor" }
lighterm-plugin-sftp = { path = "../crates/plugins/sftp" }
lighterm-plugin-snippets = { path = "../crates/plugins/snippets" }
lighterm-plugin-sync = { path = "../crates/plugins/sync" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["rt-multi-thread"] }

[target.'cfg(target_os = "linux")'.dependencies]
glib = "0.18"
