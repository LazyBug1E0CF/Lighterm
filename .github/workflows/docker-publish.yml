name: Publish Web Docker Image

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without leading v (e.g. 0.1.3). Defaults to package.json version.'
        required: false
        type: string
      push_latest:
        description: 'Also update the latest tag'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Hub secrets & resolve image names
        id: meta
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Missing required repository secrets DOCKERHUB_USERNAME and/or DOCKERHUB_TOKEN."
            exit 1
          fi
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ -n "${INPUT_VERSION}" ]; then
              VERSION="${INPUT_VERSION#v}"
            else
              VERSION="$(node -p "require('./package.json').version")"
            fi
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          GHCR_IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          DOCKERHUB_IMAGE="${DOCKERHUB_USERNAME,,}/lighterm"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "ghcr_image=${GHCR_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "dockerhub_image=${DOCKERHUB_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          labels: |
            org.opencontainers.image.title=Lighterm Web
            org.opencontainers.image.description=Lighterm self-hosted Web App (SSH/SFTP/Terminal workbench)
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          outputs: type=image,"name=${{ steps.meta.outputs.ghcr_image }},${{ steps.meta.outputs.dockerhub_image }}",push-by-digest=true,name-canonical=true
          cache-from: type=gha,scope=lighterm-web-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=lighterm-web-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          echo -n "${digest}" > "/tmp/digests/${{ matrix.arch }}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

      - name: Export web self-update bundle
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: web-bundle
          platforms: ${{ matrix.platform }}
          outputs: type=local,dest=/tmp/web-bundle-${{ matrix.arch }}
          cache-from: type=gha,scope=lighterm-web-${{ matrix.arch }}

      - name: Package web self-update tarball & SHA-256
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          BUNDLE_DIR="/tmp/web-bundle-${ARCH}"
          OUT_DIR="/tmp/web-artifacts-${ARCH}"
          mkdir -p "${OUT_DIR}"
          chmod 0755 "${BUNDLE_DIR}/lighterm-server"
          echo -n "${VERSION}" > "${BUNDLE_DIR}/VERSION"
          ARCHIVE="lighterm-web-${VERSION}-linux-${ARCH}.tar.gz"
          tar -czf "${OUT_DIR}/${ARCHIVE}" -C "${BUNDLE_DIR}" lighterm-server dist VERSION
          (cd "${OUT_DIR}" && sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256")

      - name: Upload web self-update bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-bundle-${{ matrix.arch }}
          path: /tmp/web-artifacts-${{ matrix.arch }}/*
          retention-days: 1

  merge:
    name: Create multi-arch manifests (GHCR & Docker Hub)
    needs: [build]
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Download web self-update bundles
        uses: actions/download-artifact@v4
        with:
          path: /tmp/web-bundles
          pattern: web-bundle-*
          merge-multiple: true

      - name: Resolve version tags & image names
        id: meta
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUSH_LATEST: ${{ inputs.push_latest }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ -n "${INPUT_VERSION}" ]; then
              VERSION="${INPUT_VERSION#v}"
            else
              VERSION="$(node -p "require('./package.json').version")"
            fi
            PUSH_LATEST="${INPUT_PUSH_LATEST:-true}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
            if [[ "${VERSION}" == *-* ]]; then
              PUSH_LATEST="false"
            else
              PUSH_LATEST="true"
            fi
          fi

          GHCR_IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          DOCKERHUB_IMAGE="${DOCKERHUB_USERNAME,,}/lighterm"
          AMD64_DIGEST="$(cat /tmp/digests/amd64)"
          ARM64_DIGEST="$(cat /tmp/digests/arm64)"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "push_latest=${PUSH_LATEST}" >> "$GITHUB_OUTPUT"
          echo "ghcr_image=${GHCR_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "dockerhub_image=${DOCKERHUB_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "amd64_digest=${AMD64_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "arm64_digest=${ARM64_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish multi-arch manifest to GHCR
        run: |
          GHCR_IMAGE="${{ steps.meta.outputs.ghcr_image }}"
          VERSION="${{ steps.meta.outputs.version }}"
          ARGS=(-t "${GHCR_IMAGE}:${VERSION}")
          if [ "${{ steps.meta.outputs.push_latest }}" = "true" ]; then
            ARGS+=(-t "${GHCR_IMAGE}:latest")
          fi
          docker buildx imagetools create "${ARGS[@]}" \
            "${GHCR_IMAGE}@${{ steps.meta.outputs.amd64_digest }}" \
            "${GHCR_IMAGE}@${{ steps.meta.outputs.arm64_digest }}"
          docker buildx imagetools inspect "${GHCR_IMAGE}:${VERSION}"

      - name: Publish multi-arch manifest to Docker Hub
        run: |
          DOCKERHUB_IMAGE="${{ steps.meta.outputs.dockerhub_image }}"
          VERSION="${{ steps.meta.outputs.version }}"
          ARGS=(-t "${DOCKERHUB_IMAGE}:${VERSION}")
          if [ "${{ steps.meta.outputs.push_latest }}" = "true" ]; then
            ARGS+=(-t "${DOCKERHUB_IMAGE}:latest")
          fi
          docker buildx imagetools create "${ARGS[@]}" \
            "${DOCKERHUB_IMAGE}@${{ steps.meta.outputs.amd64_digest }}" \
            "${DOCKERHUB_IMAGE}@${{ steps.meta.outputs.arm64_digest }}"
          docker buildx imagetools inspect "${DOCKERHUB_IMAGE}:${VERSION}"

      - name: Upload web self-update bundles to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.meta.outputs.version }}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" /tmp/web-bundles/*.tar.gz /tmp/web-bundles/*.sha256 --clobber
          else
            echo "::notice::GitHub Release ${TAG} does not exist yet; skipping self-update bundle upload."
          fi
