name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without leading v (e.g. 0.1.3). Defaults to package.json version.'
        required: false
        type: string
      push_latest:
        description: 'Also update the latest Docker tag'
        required: false
        default: true
        type: boolean
      publish_docker:
        description: 'Build & publish Docker images to GHCR and Docker Hub'
        required: false
        default: true
        type: boolean
      publish_release:
        description: 'Create/update GitHub Release and upload artifacts'
        required: false
        default: true
        type: boolean
      prerelease:
        description: 'Mark GitHub Release as prerelease (workflow_dispatch only)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      push_latest: ${{ steps.meta.outputs.push_latest }}
      publish_docker: ${{ steps.meta.outputs.publish_docker }}
      publish_release: ${{ steps.meta.outputs.publish_release }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      ghcr_image: ${{ steps.meta.outputs.ghcr_image }}
      dockerhub_image: ${{ steps.meta.outputs.dockerhub_image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release metadata, secrets & manifest versions
        id: meta
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUSH_LATEST: ${{ inputs.push_latest }}
          INPUT_PUBLISH_DOCKER: ${{ inputs.publish_docker }}
          INPUT_PUBLISH_RELEASE: ${{ inputs.publish_release }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ -n "${INPUT_VERSION}" ]; then
              VERSION="${INPUT_VERSION#v}"
            else
              VERSION="$(node -p "require('./package.json').version")"
            fi
            PUSH_LATEST="${INPUT_PUSH_LATEST:-true}"
            PUBLISH_DOCKER="${INPUT_PUBLISH_DOCKER:-true}"
            PUBLISH_RELEASE="${INPUT_PUBLISH_RELEASE:-true}"
            PRERELEASE="${INPUT_PRERELEASE:-false}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
            PUBLISH_DOCKER="true"
            PUBLISH_RELEASE="true"
            if [[ "${VERSION}" == *-* ]]; then
              PUSH_LATEST="false"
              PRERELEASE="true"
            else
              PUSH_LATEST="true"
              PRERELEASE="false"
            fi
          fi

          TAG="v${VERSION}"
          GHCR_IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [ -n "${DOCKERHUB_USERNAME}" ]; then
            DOCKERHUB_IMAGE="${DOCKERHUB_USERNAME,,}/lighterm"
          else
            DOCKERHUB_IMAGE=""
          fi

          if [ "${PUBLISH_DOCKER}" = "true" ]; then
            if [ -z "${DOCKERHUB_USERNAME}" ] || [ -z "${DOCKERHUB_TOKEN}" ]; then
              echo "::error::Missing required repository secrets DOCKERHUB_USERNAME and/or DOCKERHUB_TOKEN."
              exit 1
            fi
          fi

          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            EXPECTED_VERSION="${VERSION}" node -e '
              const fs = require("fs");
              const expected = process.env.EXPECTED_VERSION;
              const jsonFiles = ["package.json", "src-tauri/tauri.conf.json"];
              const tomlFiles = [
                "src-tauri/Cargo.toml",
                "crates/lighterm-core/Cargo.toml",
                "crates/lighterm-server/Cargo.toml",
                "crates/lighterm-installer/Cargo.toml",
              ];
              const mismatches = [];
              for (const f of jsonFiles) {
                const actual = JSON.parse(fs.readFileSync(f, "utf8")).version;
                if (actual !== expected) mismatches.push(`${f}: ${actual} !== ${expected}`);
              }
              for (const f of tomlFiles) {
                const content = fs.readFileSync(f, "utf8");
                const pkgMatch = content.match(/\[package\][\s\S]*?(?=\n\[|$)/);
                const verMatch = pkgMatch && pkgMatch[0].match(/^version\s*=\s*"([^"]+)"/m);
                const actual = verMatch ? verMatch[1] : "<missing>";
                if (actual !== expected) mismatches.push(`${f}: ${actual} !== ${expected}`);
              }
              if (mismatches.length > 0) {
                console.error("Version mismatch against tag:", mismatches.join("; "));
                process.exit(1);
              }
              console.log(`All 6 manifests match version ${expected}.`);
            '
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "push_latest=${PUSH_LATEST}" >> "$GITHUB_OUTPUT"
          echo "publish_docker=${PUBLISH_DOCKER}" >> "$GITHUB_OUTPUT"
          echo "publish_release=${PUBLISH_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "ghcr_image=${GHCR_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "dockerhub_image=${DOCKERHUB_IMAGE}" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build Windows Installer (x64)
    needs: [prepare]
    runs-on: windows-latest
    env:
      CI: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-x64

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows x64 installer
        run: node scripts/build-installer.mjs

      - name: Verify and stage Windows installer artifacts
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          SETUP_NAME="Lighterm-Setup-${VERSION}-x64.exe"
          SETUP_PATH="target/release/${SETUP_NAME}"
          SHA_PATH="${SETUP_PATH}.sha256"

          test -f "${SETUP_PATH}"
          test -s "${SETUP_PATH}"
          test -f "${SHA_PATH}"
          (cd target/release && sha256sum -c "${SETUP_NAME}.sha256")

          mkdir -p release-staging/windows-x64
          cp "${SETUP_PATH}" "${SHA_PATH}" release-staging/windows-x64/
          ls -lh release-staging/windows-x64/

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-windows-x64
          path: release-staging/windows-x64/*
          if-no-files-found: error
          retention-days: 1

  build-linux:
    name: Build Linux Packages (${{ matrix.arch }})
    needs: [prepare]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    env:
      APPIMAGE_EXTRACT_AND_RUN: '1'
      NO_STRIP: 'true'
      CI: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Tauri & packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libxdo-dev \
            libssl-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf \
            file \
            rpm \
            xdg-utils

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-desktop-${{ matrix.arch }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Linux bundles (.deb, .rpm, .AppImage)
        run: pnpm tauri build --bundles deb,rpm,appimage

      - name: Verify, stage & checksum Linux packages
        run: |
          shopt -s nullglob
          ARCH="${{ matrix.arch }}"
          OUT_DIR="/tmp/linux-artifacts-${ARCH}"
          mkdir -p "${OUT_DIR}"

          DEB_FILES=(target/release/bundle/deb/*.deb)
          RPM_FILES=(target/release/bundle/rpm/*.rpm)
          APPIMAGE_FILES=(target/release/bundle/appimage/*.AppImage)

          if [ "${#DEB_FILES[@]}" -eq 0 ]; then
            echo "::error::Missing .deb bundle in target/release/bundle/deb/"
            exit 1
          fi
          if [ "${#RPM_FILES[@]}" -eq 0 ]; then
            echo "::error::Missing .rpm bundle in target/release/bundle/rpm/"
            exit 1
          fi
          if [ "${#APPIMAGE_FILES[@]}" -eq 0 ]; then
            echo "::error::Missing .AppImage bundle in target/release/bundle/appimage/"
            exit 1
          fi

          for pkg in "${DEB_FILES[@]}"; do
            dpkg-deb --info "${pkg}"
          done
          for pkg in "${RPM_FILES[@]}"; do
            rpm -qip "${pkg}"
          done
          for pkg in "${APPIMAGE_FILES[@]}"; do
            test -s "${pkg}"
            file "${pkg}"
          done

          cp "${DEB_FILES[@]}" "${RPM_FILES[@]}" "${APPIMAGE_FILES[@]}" "${OUT_DIR}/"
          (
            cd "${OUT_DIR}"
            for f in *.deb *.rpm *.AppImage; do
              sha256sum "$f" > "${f}.sha256"
            done
          )
          ls -lh "${OUT_DIR}/"

      - name: Upload Linux package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-linux-${{ matrix.arch }}
          path: /tmp/linux-artifacts-${{ matrix.arch }}/*
          if-no-files-found: error
          retention-days: 1

  build-web-docker:
    name: Build Web Docker & Bundle (${{ matrix.arch }})
    needs: [prepare]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: needs.prepare.outputs.publish_docker == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: needs.prepare.outputs.publish_docker == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        if: needs.prepare.outputs.publish_docker == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          labels: |
            org.opencontainers.image.title=Lighterm Web
            org.opencontainers.image.description=Lighterm self-hosted Web App (SSH/SFTP/Terminal workbench)
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          outputs: type=image,"name=${{ needs.prepare.outputs.ghcr_image }},${{ needs.prepare.outputs.dockerhub_image }}",push-by-digest=true,name-canonical=true
          cache-from: type=gha,scope=lighterm-web-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=lighterm-web-${{ matrix.arch }}

      - name: Build Docker image (dry-run)
        if: needs.prepare.outputs.publish_docker != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          labels: |
            org.opencontainers.image.title=Lighterm Web
            org.opencontainers.image.description=Lighterm self-hosted Web App (SSH/SFTP/Terminal workbench)
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=lighterm-web-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=lighterm-web-${{ matrix.arch }}

      - name: Export digest
        if: needs.prepare.outputs.publish_docker == 'true'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          echo -n "${digest}" > "/tmp/digests/${{ matrix.arch }}"

      - name: Upload digest artifact
        if: needs.prepare.outputs.publish_docker == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Export web self-update bundle
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: web-bundle
          platforms: ${{ matrix.platform }}
          outputs: type=local,dest=/tmp/web-bundle-${{ matrix.arch }}
          cache-from: type=gha,scope=lighterm-web-${{ matrix.arch }}

      - name: Package web self-update tarball & SHA-256
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          BUNDLE_DIR="/tmp/web-bundle-${ARCH}"
          OUT_DIR="/tmp/web-artifacts-${ARCH}"
          mkdir -p "${OUT_DIR}"
          chmod 0755 "${BUNDLE_DIR}/lighterm-server"
          echo -n "${VERSION}" > "${BUNDLE_DIR}/VERSION"
          ARCHIVE="lighterm-web-${VERSION}-linux-${ARCH}.tar.gz"
          tar -czf "${OUT_DIR}/${ARCHIVE}" -C "${BUNDLE_DIR}" lighterm-server dist VERSION
          (cd "${OUT_DIR}" && sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256")
          ls -lh "${OUT_DIR}/"

      - name: Upload web self-update bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-web-${{ matrix.arch }}
          path: /tmp/web-artifacts-${{ matrix.arch }}/*
          if-no-files-found: error
          retention-days: 1

  publish-docker:
    name: Create multi-arch manifests (GHCR & Docker Hub)
    needs: [prepare, build-web-docker]
    if: needs.prepare.outputs.publish_docker == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Read platform digests
        id: digests
        run: |
          echo "amd64_digest=$(cat /tmp/digests/amd64)" >> "$GITHUB_OUTPUT"
          echo "arm64_digest=$(cat /tmp/digests/arm64)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish multi-arch manifest to GHCR
        run: |
          GHCR_IMAGE="${{ needs.prepare.outputs.ghcr_image }}"
          VERSION="${{ needs.prepare.outputs.version }}"
          ARGS=(-t "${GHCR_IMAGE}:${VERSION}")
          if [ "${{ needs.prepare.outputs.push_latest }}" = "true" ]; then
            ARGS+=(-t "${GHCR_IMAGE}:latest")
          fi
          docker buildx imagetools create "${ARGS[@]}" \
            "${GHCR_IMAGE}@${{ steps.digests.outputs.amd64_digest }}" \
            "${GHCR_IMAGE}@${{ steps.digests.outputs.arm64_digest }}"
          docker buildx imagetools inspect "${GHCR_IMAGE}:${VERSION}"

      - name: Publish multi-arch manifest to Docker Hub
        run: |
          DOCKERHUB_IMAGE="${{ needs.prepare.outputs.dockerhub_image }}"
          VERSION="${{ needs.prepare.outputs.version }}"
          ARGS=(-t "${DOCKERHUB_IMAGE}:${VERSION}")
          if [ "${{ needs.prepare.outputs.push_latest }}" = "true" ]; then
            ARGS+=(-t "${DOCKERHUB_IMAGE}:latest")
          fi
          docker buildx imagetools create "${ARGS[@]}" \
            "${DOCKERHUB_IMAGE}@${{ steps.digests.outputs.amd64_digest }}" \
            "${DOCKERHUB_IMAGE}@${{ steps.digests.outputs.arm64_digest }}"
          docker buildx imagetools inspect "${DOCKERHUB_IMAGE}:${VERSION}"

  publish-release:
    name: Create or Update GitHub Release
    needs: [prepare, build-windows, build-linux, build-web-docker, publish-docker]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.publish_release == 'true' &&
      needs.build-windows.result == 'success' &&
      needs.build-linux.result == 'success' &&
      needs.build-web-docker.result == 'success' &&
      (needs.publish-docker.result == 'success' || needs.publish-docker.result == 'skipped')
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all release assets
        uses: actions/download-artifact@v4
        with:
          path: /tmp/release-assets
          pattern: release-assets-*
          merge-multiple: true

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PUSH_LATEST: ${{ needs.prepare.outputs.push_latest }}
          PUBLISH_DOCKER: ${{ needs.prepare.outputs.publish_docker }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          GHCR_IMAGE: ${{ needs.prepare.outputs.ghcr_image }}
          DOCKERHUB_IMAGE: ${{ needs.prepare.outputs.dockerhub_image }}
        run: |
          shopt -s nullglob
          ASSETS=(/tmp/release-assets/*)
          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "::error::No release assets found in /tmp/release-assets."
            exit 1
          fi
          ls -lh /tmp/release-assets/

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; uploading assets with --clobber."
            gh release upload "${TAG}" "${ASSETS[@]}" --clobber
            exit 0
          fi

          GENERATED_NOTES="$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="${TAG}" -f target_commitish="${GITHUB_SHA}" --jq .body 2>/dev/null || true)"
          CHECKSUMS="$(cd /tmp/release-assets && LC_ALL=C sort -u *.sha256)"

          {
            echo "# Lighterm ${TAG}"
            echo ""
            if [ -n "${GENERATED_NOTES}" ]; then
              echo "${GENERATED_NOTES}"
              echo ""
            fi
            echo "## Downloads"
            echo ""
            echo "### Desktop"
            echo "- **Windows x64**: \`Lighterm-Setup-${VERSION}-x64.exe\` (custom Obsidian Spotlight installer)"
            echo "- **Linux x86_64 (amd64)**: \`.deb\` (Debian / Ubuntu / Deepin), \`.rpm\` (Fedora / RHEL / openSUSE), \`.AppImage\` (universal)"
            echo "- **Linux arm64 (aarch64)**: \`.deb\`, \`.rpm\`, \`.AppImage\`"
            echo ""
            echo "### Web App (Docker & Self-Update)"
            if [ "${PUBLISH_DOCKER}" = "true" ]; then
              if [ "${PUSH_LATEST}" = "true" ]; then
                echo "- **GHCR**: \`${GHCR_IMAGE}:${VERSION}\` (\`:latest\`)"
                if [ -n "${DOCKERHUB_IMAGE}" ]; then
                  echo "- **Docker Hub**: \`${DOCKERHUB_IMAGE}:${VERSION}\` (\`:latest\`)"
                fi
              else
                echo "- **GHCR**: \`${GHCR_IMAGE}:${VERSION}\`"
                if [ -n "${DOCKERHUB_IMAGE}" ]; then
                  echo "- **Docker Hub**: \`${DOCKERHUB_IMAGE}:${VERSION}\`"
                fi
              fi
            fi
            echo "- **Self-update bundles**: \`lighterm-web-${VERSION}-linux-amd64.tar.gz\`, \`lighterm-web-${VERSION}-linux-arm64.tar.gz\`"
            echo ""
            echo "## SHA-256 Checksums"
            echo ""
            echo '```text'
            echo "${CHECKSUMS}"
            echo '```'
          } > /tmp/release-notes.md

          CREATE_ARGS=(
            "${TAG}"
            "${ASSETS[@]}"
            --title "Lighterm ${TAG}"
            --notes-file /tmp/release-notes.md
          )
          if [ "${PRERELEASE}" = "true" ]; then
            CREATE_ARGS+=(--prerelease)
          fi
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            CREATE_ARGS+=(--target "${GITHUB_SHA}")
          fi

          gh release create "${CREATE_ARGS[@]}"
