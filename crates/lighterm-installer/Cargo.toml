[package]
name = "lighterm-installer"
version = "0.1.3"
description = "Custom Obsidian Spotlight Windows installer and uninstaller for Lighterm"
edition = "2021"
license.workspace = true

[[bin]]
name = "lighterm-installer"
path = "src/bin/installer.rs"

[[bin]]
name = "pack-setup"
path = "src/bin/pack_setup.rs"

[dependencies]
crc32fast = "1.5"
dirs = "6"
flate2 = "1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
rfd = "0.17"
tao = "0.37"
winreg = "0.56"
wry = "0.57"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
tauri-winres = "0.3"
