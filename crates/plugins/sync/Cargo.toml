[package]
name = "lighterm-plugin-sync"
version = "0.1.0"
edition = "2021"
description = "Cross-device GitHub configuration synchronization plugin for Lighterm"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
lighterm-core = { path = "../../lighterm-core" }
parking_lot = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "http2", "charset", "system-proxy"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "net", "io-util"] }
tracing = "0.1"
url = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
