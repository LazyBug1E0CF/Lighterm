[package]
name = "lighterm-plugin-monitor"
version = "0.1.0"
edition = "2021"
description = "Local and remote SSH system monitor plugin for Lighterm"

[dependencies]
chrono = "0.4"
lighterm-core = { path = "../../lighterm-core" }
parking_lot = "0.12"
russh = { version = "0.65", default-features = false, features = ["flate2", "ring", "rsa"] }
serde = { version = "1", features = ["derive"] }
sysinfo = { version = "0.40", default-features = false, features = ["system", "disk", "network"] }
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tempfile = "3"
