[package]
name = "lighterm-plugin-sftp"
version = "0.1.0"
edition = "2021"
description = "SFTP browser and file transfer plugin for Lighterm"

[dependencies]
lighterm-core = { path = "../../lighterm-core" }
parking_lot = "0.12"
russh-sftp = "3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "rt", "sync"] }
uuid = { version = "1", features = ["v4"] }
