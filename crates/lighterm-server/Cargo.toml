[package]
name = "lighterm-server"
version = "0.1.2"
edition = "2021"
description = "Standalone HTTP/WebSocket web backend server for Lighterm"

[[bin]]
name = "lighterm-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
futures-util = "0.3"
http = "1"
lighterm-core = { path = "../lighterm-core" }
lighterm-plugin-history = { path = "../plugins/history" }
lighterm-plugin-monitor = { path = "../plugins/monitor" }
lighterm-plugin-sftp = { path = "../plugins/sftp" }
lighterm-plugin-snippets = { path = "../plugins/snippets" }
lighterm-plugin-sync = { path = "../plugins/sync" }
parking_lot = "0.12"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
